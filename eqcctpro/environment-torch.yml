name: eqcctpro-torch
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - readline
  - sqlite
  - tk
  - zlib
  - xz
  - ncurses
  - ca-certificates
  - openssl
  - pip:
      - eqcctpro
      - numpy==1.26.4
      - scipy==1.15.1
      - pandas==2.2.3
      - matplotlib==3.10.0
      - psutil==6.1.1
      - obspy==1.4.1
      - ray==2.42.1
      - plotly
      - seaborn
      - shapely==2.1.0
      - requests==2.32.3
      - rich==13.9.4
      # PyTorch + SeisBench stack
      - torch==2.5.1
      - torchvision==0.20.1
      - torchaudio==2.5.1
      - seisbench==0.10.2
      # Let torch/torchvision/torchaudio bring compatible CUDA wheels transitively.
      # Pinning CUDA wheel versions here can conflict with torch's required versions.
      - pynvml==12.0.0
